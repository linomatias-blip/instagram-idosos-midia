name: Gerar story de teste
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/story-teste.yml'
permissions:
  contents: read
jobs:
  story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - name: Criar story
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          im=Image.new('RGB',(1080,1920),'#F7F6F2')
          d=ImageDraw.Draw(im)
          def font(size,bold=False):
              return ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans'+('-Bold' if bold else '')+'.ttf',size)
          d.rectangle((0,0,1080,20),fill='#031E39')
          d.text((80,110),'@linomatias.idosos',font=font(38,True),fill='#031E39')
          d.text((80,205),'PARA PROFISSIONAIS',font=font(29,True),fill='#287386')
          for y,line in enumerate(['Caminhada e','treino de equilíbrio:','o que sabemos?']):
              d.text((80,390+90*y),line,font=font(65,True),fill='#031E39')
          d.line((80,740,1000,740),fill='#287386',width=5)
          for y,line in enumerate(['Exercícios de equilíbrio e','tarefas funcionais têm','evidência para reduzir quedas.']):
              d.text((80,850+76*y),line,font=font(53),fill='#031E39')
          for y,line in enumerate(['Caminhada isolada: evidência','menos conclusiva para','prevenção de quedas.']):
              d.text((80,1170+68*y),line,font=font(42),fill='#031E39')
          d.text((80,1535),'Para discutir na equipe:',font=font(35,True),fill='#287386')
          d.text((80,1600),'Qual desfecho orienta seu treino?',font=font(35),fill='#031E39')
          d.text((80,1770),'RASCUNHO — REVISÃO CIENTÍFICA OBRIGATÓRIA',font=font(23),fill='#465D6C')
          Path('stories').mkdir(exist_ok=True)
          im.save('stories/teste-equilibrio.png',optimize=True)
          PY
      # Teste de renderização local. Não salvar imagens no repositório público,
      # não subir artefatos públicos e não publicar no Instagram.
      - name: Verificar rascunho sem disponibilizar mídia
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          file = Path('stories/teste-equilibrio.png')
          with Image.open(file) as im:
              assert im.format == 'PNG' and im.size == (1080, 1920), 'Arte inválida'
              im.verify()
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('Renderização local validada (1080x1920). **Rascunho não publicado e não exportado.**\\n')
          PY

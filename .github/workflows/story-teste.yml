name: Validar layout de Story com fixture sintética
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/story-teste.yml'
      - 'README.md'
      - '.gitignore'
  push:
    branches: [main, 'fix/**']
    paths:
      - '.github/workflows/story-teste.yml'
      - 'README.md'
      - '.gitignore'
permissions:
  contents: read
concurrency:
  group: media-layout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  story:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MEDIA_TEST_OUTPUT: ${{ runner.temp }}/story-layout-fixture.png
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar dependência de renderização
        run: python -m pip install --disable-pip-version-check 'Pillow==12.3.0'
      - name: Renderizar fixture sem conteúdo científico
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          temp = Path(os.environ['RUNNER_TEMP']).resolve()
          output = Path(os.environ['MEDIA_TEST_OUTPUT']).resolve()
          if not output.is_relative_to(temp):
              raise SystemExit('Fixture deve permanecer no diretório temporário do runner.')
          output.parent.mkdir(parents=True, exist_ok=True)
          image = Image.new('RGB', (1080, 1920), '#F7F6F2')
          draw = ImageDraw.Draw(image)
          family = '/usr/share/fonts/truetype/dejavu/DejaVuSans'
          title = ImageFont.truetype(family + '-Bold.ttf', 60)
          body = ImageFont.truetype(family + '.ttf', 38)
          draw.rectangle((0, 0, 1080, 20), fill='#031E39')
          draw.text((80, 250), 'TESTE DE LAYOUT', font=title, fill='#031E39')
          for index, line in enumerate([
              'DADOS SINTÉTICOS',
              'Sem afirmações científicas.',
              'Sem conteúdo aprovado.',
              'Fixture de renderização local.',
          ]):
              draw.text((80, 650 + 90 * index), line, font=body, fill='#287386')
          draw.text((80, 1500), 'RASCUNHO — NÃO PUBLICAR', font=body, fill='#031E39')
          image.save(output, format='PNG', optimize=True)
          PY
      - name: Verificar integridade e remover fixture temporária
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image

          temp = Path(os.environ['RUNNER_TEMP']).resolve()
          output = Path(os.environ['MEDIA_TEST_OUTPUT']).resolve()
          if not output.is_relative_to(temp):
              raise SystemExit('Fixture fora do diretório temporário do runner.')
          with Image.open(output) as image:
              assert image.format == 'PNG', 'Formato inesperado'
              assert image.size == (1080, 1920), 'Dimensões inesperadas'
              assert image.mode == 'RGB', 'Modo de cor inesperado'
              image.verify()
          output.unlink()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('Fixture sintética PNG RGB 1080×1920 validada e removida. Nenhuma mídia foi disponibilizada ou publicada.\n')
          PY

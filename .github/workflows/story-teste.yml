name: Gerar story de teste
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/story-teste.yml'
permissions:
  contents: write
jobs:
  story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - name: Criar story
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          im=Image.new('RGB',(1080,1920),'#F7F6F2')
          d=ImageDraw.Draw(im)
          def font(size,bold=False):
              return ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans'+('-Bold' if bold else '')+'.ttf',size)
          d.rectangle((0,0,1080,20),fill='#031E39')
          d.text((80,110),'@linomatias.idosos',font=font(38,True),fill='#031E39')
          d.text((80,205),'PARA PROFISSIONAIS',font=font(29,True),fill='#287386')
          for y,line in enumerate(['Treinamento de','pessoas idosas:','o que priorizar?']):
              d.text((80,390+90*y),line,font=font(65,True),fill='#031E39')
          d.line((80,740,1000,740),fill='#287386',width=5)
          for y,line in enumerate(['Para reduzir quedas,','não dependa apenas','de caminhada.']):
              d.text((80,850+76*y),line,font=font(53),fill='#031E39')
          for y,line in enumerate(['Programas que desafiam','progressivamente o equilíbrio','têm evidências de benefício.']):
              d.text((80,1170+68*y),line,font=font(42),fill='#031E39')
          d.text((80,1535),'Pergunta para sua prática:',font=font(35,True),fill='#287386')
          d.text((80,1600),'Seu treino desafia o equilíbrio?',font=font(35),fill='#031E39')
          d.text((80,1770),'Fonte: Sherrington et al., Cochrane 2019',font=font(23),fill='#465D6C')
          Path('stories').mkdir(exist_ok=True)
          im.save('stories/teste-equilibrio.png',optimize=True)
          PY
      - name: Publicar mídia no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories/teste-equilibrio.png
          git diff --cached --quiet || (git commit -m "media: story científico de teste" && git push)
